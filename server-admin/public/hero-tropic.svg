<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <title>Tropical sunset over an island lagoon</title>
  <defs>
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="640">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.3" stop-color="#1e1b4b"/>
      <stop offset="0.56" stop-color="#581c87"/>
      <stop offset="0.78" stop-color="#be185d"/>
      <stop offset="0.92" stop-color="#f97316"/>
      <stop offset="1" stop-color="#fdba74"/>
    </linearGradient>
    <linearGradient id="sea" gradientUnits="userSpaceOnUse" x1="0" y1="640" x2="0" y2="1000">
      <stop offset="0" stop-color="#9a3412"/>
      <stop offset="0.1" stop-color="#4c1d3d"/>
      <stop offset="0.42" stop-color="#134e4a"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#fffbeb"/>
      <stop offset="0.45" stop-color="#fed7aa"/>
      <stop offset="1" stop-color="#fb923c"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3c7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <clipPath id="above">
      <rect width="1600" height="640"/>
    </clipPath>
    <mask id="crescent">
      <rect width="1600" height="1000" fill="#000"/>
      <circle cx="1330" cy="160" r="42" fill="#fff"/>
      <circle cx="1350" cy="146" r="38" fill="#000"/>
    </mask>
    <path id="frond" d="M0 0 C42 -28 96 -24 136 18 C100 -6 48 -11 0 0 Z"/>
    <g id="crown">
      <use xlink:href="#frond" transform="rotate(-48) scale(1.05)"/>
      <use xlink:href="#frond" transform="rotate(-14) scale(1.15)"/>
      <use xlink:href="#frond" transform="rotate(22) scale(1.05)"/>
      <use xlink:href="#frond" transform="rotate(58) scale(0.85)"/>
      <use xlink:href="#frond" transform="rotate(-84) scale(0.75)"/>
      <use xlink:href="#frond" transform="scale(-1 1) rotate(-52)"/>
      <use xlink:href="#frond" transform="scale(-1 1) rotate(-16) scale(1.1)"/>
      <use xlink:href="#frond" transform="scale(-1 1) rotate(24)"/>
      <use xlink:href="#frond" transform="scale(-1 1) rotate(62) scale(0.8)"/>
      <circle cx="-4" cy="10" r="6"/>
      <circle cx="7" cy="12" r="5.5"/>
      <circle cx="1" cy="19" r="5"/>
    </g>
    <g id="hut">
      <path d="M-14 0 L0 -14 L14 0 Z"/>
      <rect x="-10" y="0" width="20" height="10"/>
      <rect x="-9" y="10" width="1.6" height="12"/>
      <rect x="7.4" y="10" width="1.6" height="12"/>
    </g>
  </defs>

  <rect width="1600" height="640" fill="url(#sky)"/>

  <g fill="#fef3c7">
    <circle cx="60" cy="52" r="1.6" opacity="0.9"/>
    <circle cx="148" cy="130" r="1.2" opacity="0.6"/>
    <circle cx="236" cy="40" r="1.4" opacity="0.8"/>
    <circle cx="322" cy="168" r="1" opacity="0.5"/>
    <circle cx="402" cy="78" r="1.6" opacity="0.9"/>
    <circle cx="488" cy="196" r="1.1" opacity="0.5"/>
    <circle cx="566" cy="34" r="1.3" opacity="0.8"/>
    <circle cx="640" cy="122" r="1" opacity="0.6"/>
    <circle cx="712" cy="58" r="1.5" opacity="0.8"/>
    <circle cx="786" cy="176" r="1" opacity="0.5"/>
    <circle cx="858" cy="30" r="1.3" opacity="0.9"/>
    <circle cx="930" cy="104" r="1.1" opacity="0.6"/>
    <circle cx="1006" cy="208" r="1" opacity="0.4"/>
    <circle cx="1080" cy="46" r="1.6" opacity="0.9"/>
    <circle cx="1154" cy="140" r="1.1" opacity="0.6"/>
    <circle cx="1228" cy="64" r="1.2" opacity="0.7"/>
    <circle cx="1440" cy="96" r="1.4" opacity="0.8"/>
    <circle cx="1512" cy="44" r="1.2" opacity="0.7"/>
    <circle cx="1560" cy="186" r="1" opacity="0.5"/>
    <circle cx="1470" cy="250" r="0.9" opacity="0.4"/>
    <circle cx="96" cy="262" r="0.9" opacity="0.4"/>
    <circle cx="560" cy="270" r="0.9" opacity="0.35"/>
    <circle cx="1060" cy="290" r="0.9" opacity="0.35"/>
  </g>

  <circle cx="1330" cy="160" r="120" fill="url(#moonGlow)"/>
  <rect width="1600" height="1000" fill="#fef3c7" mask="url(#crescent)"/>

  <g clip-path="url(#above)">
    <circle cx="800" cy="640" r="360" fill="#fb923c" opacity="0.35" filter="url(#glow)"/>
    <circle cx="800" cy="640" r="170" fill="url(#sun)"/>
  </g>

  <g fill="none" stroke="#1e0b25" stroke-width="2.4" stroke-linecap="round">
    <path d="M1090 196 q9 -9 18 0 q9 -9 18 0"/>
    <path d="M1140 226 q6 -6 12 0 q6 -6 12 0"/>
    <path d="M1060 238 q5 -5 10 0 q5 -5 10 0"/>
  </g>

  <path d="M0 640 C60 612 130 600 200 618 C240 604 290 606 330 640 Z" fill="#2a0f2e"/>
  <path d="M500 640 C540 628 590 626 640 640 Z" fill="#3b1235" opacity="0.8"/>
  <path d="M960 640 C1010 630 1050 612 1090 580 C1120 556 1140 500 1168 456 C1184 432 1200 440 1210 470 C1224 516 1244 556 1290 590 C1340 620 1420 630 1600 626 L1600 640 Z" fill="#042f2e"/>
  <path d="M1168 470 C1176 452 1186 446 1192 456 C1198 474 1194 500 1184 520 Z" fill="#0f4c4a" opacity="0.6"/>

  <rect y="640" width="1600" height="360" fill="url(#sea)"/>
  <rect y="639" width="1600" height="2" fill="#fed7aa" opacity="0.55"/>

  <ellipse cx="800" cy="700" rx="190" ry="70" fill="#fb923c" opacity="0.3" filter="url(#glow)"/>
  <g fill="#fdba74">
    <rect x="700" y="750" width="200" height="3.2" rx="1.6" opacity="0.26"/>
    <rect x="745" y="782" width="110" height="3" rx="1.5" opacity="0.2"/>
    <rect x="730" y="818" width="140" height="2.6" rx="1.3" opacity="0.14"/>
    <rect x="770" y="858" width="60" height="2.4" rx="1.2" opacity="0.1"/>
  </g>

  <g fill="#022c22">
    <rect x="1050" y="697" width="190" height="3"/>
    <use xlink:href="#hut" transform="translate(1080 670) scale(1.4)"/>
    <use xlink:href="#hut" transform="translate(1140 670) scale(1.55)"/>
    <use xlink:href="#hut" transform="translate(1200 670) scale(1.4)"/>
    <rect x="1056" y="699" width="2" height="14"/>
    <rect x="1234" y="699" width="2" height="14"/>
  </g>
  <g fill="#fde68a" opacity="0.9">
    <rect x="1076" y="673" width="8" height="7" rx="1.2"/>
    <rect x="1135" y="673" width="9" height="8" rx="1.2"/>
    <rect x="1196" y="673" width="8" height="7" rx="1.2"/>
  </g>

  <g fill="#1e0b25">
    <path d="M436 700 L436 640 L470 698 Z"/>
    <path d="M432 640 L432 700 L412 697 Z" opacity="0.85"/>
    <path d="M400 704 L482 704 L472 716 L410 716 Z"/>
  </g>

  <g fill="#020617">
    <path d="M0 1000 L0 900 C120 870 260 880 380 930 C430 950 470 975 500 1000 Z"/>
    <path d="M1600 1000 L1600 880 C1480 860 1340 880 1220 940 C1180 960 1150 980 1130 1000 Z"/>

    <path d="M30 1000 C58 840 124 640 204 452 L220 459 C146 644 90 840 80 1000 Z"/>
    <use xlink:href="#crown" transform="translate(212 456) scale(1.75)"/>

    <path d="M150 1000 C150 880 124 760 98 640 L108 636 C136 756 168 878 176 1000 Z"/>
    <use xlink:href="#crown" transform="translate(103 638) scale(1.2)"/>

    <path d="M1590 1000 C1570 840 1504 650 1424 470 L1408 477 C1482 656 1530 840 1540 1000 Z"/>
    <use xlink:href="#crown" transform="translate(1416 474) scale(1.75)"/>
  </g>
</svg>
