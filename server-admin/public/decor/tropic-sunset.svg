<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 300 800" preserveAspectRatio="xMidYMid slice">
  <title>Tropical sunset</title>
  <defs>
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="480">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.35" stop-color="#1e1b4b"/>
      <stop offset="0.62" stop-color="#6b21a8"/>
      <stop offset="0.8" stop-color="#be185d"/>
      <stop offset="0.93" stop-color="#f97316"/>
      <stop offset="1" stop-color="#fdba74"/>
    </linearGradient>
    <linearGradient id="sea" gradientUnits="userSpaceOnUse" x1="0" y1="480" x2="0" y2="800">
      <stop offset="0" stop-color="#9a3412"/>
      <stop offset="0.12" stop-color="#4c1d3d"/>
      <stop offset="0.4" stop-color="#134e4a"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#fffbeb"/>
      <stop offset="0.45" stop-color="#fed7aa"/>
      <stop offset="1" stop-color="#fb923c"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="above">
      <rect width="300" height="480"/>
    </clipPath>
    <clipPath id="sunDisc">
      <circle cx="176" cy="470" r="76"/>
    </clipPath>
    <path id="frond" d="M0 0 C42 -28 96 -24 136 18 C100 -6 48 -11 0 0 Z"/>
  </defs>

  <rect width="300" height="480" fill="url(#sky)"/>

  <g fill="#fef3c7">
    <circle cx="34" cy="48" r="1.2" opacity="0.9"/>
    <circle cx="88" cy="96" r="0.9" opacity="0.7"/>
    <circle cx="142" cy="38" r="1.4" opacity="0.8"/>
    <circle cx="214" cy="74" r="1" opacity="0.7"/>
    <circle cx="268" cy="30" r="1.3" opacity="0.9"/>
    <circle cx="252" cy="138" r="0.8" opacity="0.5"/>
    <circle cx="58" cy="168" r="0.9" opacity="0.5"/>
    <circle cx="180" cy="122" r="0.8" opacity="0.6"/>
  </g>

  <g clip-path="url(#above)">
    <circle cx="176" cy="470" r="150" fill="#fb923c" opacity="0.35" filter="url(#glow)"/>
    <circle cx="176" cy="470" r="76" fill="url(#sun)"/>
    <g fill="#be185d" opacity="0.55" clip-path="url(#sunDisc)">
      <rect x="90" y="440" width="180" height="3"/>
      <rect x="90" y="452" width="180" height="4"/>
      <rect x="90" y="464" width="180" height="6"/>
    </g>
  </g>

  <path d="M0 480 C26 464 52 457 78 468 C92 460 108 463 122 480 Z" fill="#2a0f2e"/>
  <path d="M232 480 C246 472 262 470 280 474 C290 470 296 471 300 472 L300 480 Z" fill="#2a0f2e"/>

  <rect y="480" width="300" height="320" fill="url(#sea)"/>
  <rect y="479" width="300" height="1.6" fill="#fed7aa" opacity="0.55"/>
  <g fill="#fdba74">
    <rect x="120" y="490" width="112" height="3" rx="1.5" opacity="0.7"/>
    <rect x="136" y="502" width="80" height="2.6" rx="1.3" opacity="0.55"/>
    <rect x="128" y="515" width="96" height="2.4" rx="1.2" opacity="0.4"/>
    <rect x="148" y="530" width="56" height="2.2" rx="1.1" opacity="0.35"/>
    <rect x="140" y="547" width="72" height="2" rx="1" opacity="0.25"/>
    <rect x="158" y="566" width="36" height="2" rx="1" opacity="0.2"/>
    <rect x="152" y="588" width="48" height="1.8" rx="0.9" opacity="0.14"/>
  </g>

  <g fill="none" stroke="#1e0b25" stroke-width="1.6" stroke-linecap="round">
    <path d="M196 214 q6 -6 12 0 q6 -6 12 0"/>
    <path d="M226 236 q4 -4 8 0 q4 -4 8 0"/>
    <path d="M172 250 q3.5 -3.5 7 0 q3.5 -3.5 7 0"/>
  </g>

  <g fill="#020617">
    <path d="M0 800 L0 712 C52 694 128 702 186 728 C230 748 270 764 300 772 L300 800 Z"/>

    <path d="M26 800 C36 640 66 470 106 334 L117 338 C84 472 60 640 54 800 Z"/>
    <g transform="translate(112 334)">
      <use xlink:href="#frond" transform="rotate(-48) scale(1.05)"/>
      <use xlink:href="#frond" transform="rotate(-14) scale(1.15)"/>
      <use xlink:href="#frond" transform="rotate(22) scale(1.05)"/>
      <use xlink:href="#frond" transform="rotate(58) scale(0.85)"/>
      <use xlink:href="#frond" transform="rotate(-84) scale(0.75)"/>
      <use xlink:href="#frond" transform="scale(-1 1) rotate(-52) scale(1)"/>
      <use xlink:href="#frond" transform="scale(-1 1) rotate(-16) scale(1.1)"/>
      <use xlink:href="#frond" transform="scale(-1 1) rotate(24) scale(1)"/>
      <use xlink:href="#frond" transform="scale(-1 1) rotate(62) scale(0.8)"/>
      <circle cx="-4" cy="10" r="6"/>
      <circle cx="7" cy="12" r="5.5"/>
      <circle cx="1" cy="19" r="5"/>
    </g>

    <path d="M234 800 C240 702 250 628 260 566 L266 568 C258 630 252 702 250 800 Z"/>
    <g transform="translate(263 566) scale(0.62)">
      <use xlink:href="#frond" transform="rotate(-40)"/>
      <use xlink:href="#frond" transform="rotate(-6) scale(1.1)"/>
      <use xlink:href="#frond" transform="rotate(32)"/>
      <use xlink:href="#frond" transform="rotate(-80) scale(0.8)"/>
      <use xlink:href="#frond" transform="scale(-1 1) rotate(-44)"/>
      <use xlink:href="#frond" transform="scale(-1 1) rotate(-8) scale(1.1)"/>
      <use xlink:href="#frond" transform="scale(-1 1) rotate(30)"/>
    </g>
  </g>
