      <use xlink:href="#frond" transform="rotate(20)"/>
      <use xlink:href="#frond" transform="rotate(56) scale(0.85)"/>
      <use xlink:href="#frond" transform="rotate(-86) scale(0.7)"/>
      <use xlink:href="#frond" transform="scale(-1 1) rotate(-46) scale(1.05)"/>
      <use xlink:href="#frond" transform="scale(-1 1) rotate(-12) scale(1.15)"/>
