  <path d="M60 470 C92 462 108 440 122 410 C132 388 138 336 156 304 C166 288 176 296 182 324 C190 364 200 396 224 418 C250 440 278 452 300 456 L300 470 Z" fill="#042f2e"/>
  <path d="M150 330 C156 318 162 312 166 318 C170 328 168 346 162 360 Z" fill="#0f4c4a" opacity="0.6"/>

