# Applies Drizzle migrations to the production Supabase database after a merge that changes drizzle/**.
# Vercel deploys the same commit at the same time, so every migration must be backward compatible
# with the previous release (add first, remove in a later release). See docs/adr/0003-ci-gates-deploy.md.
name: Migrate database

on:
  push:
    branches: [main]
    paths: ["drizzle/**"]
  workflow_dispatch:

concurrency:
  group: migrate-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Secret DIRECT_URL (Supabase session pooler, port 5432) lives only in this environment.
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
